<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barbara Karbowiak — Woda Kangen | Oficjalny sklep EWS</title>
  <meta name="description" content="Hej, jestem Barbara Karbowiak — niezależny dystrybutor japońskich jonizatorów wody Kangen. Zapraszam do mojego oficjalnego sklepu EWS Enagic.">
  <link rel="canonical" href="https://kangenpolska.pl/">
  <meta property="og:title" content="Barbara Karbowiak — Woda Kangen">
  <meta property="og:description" content="Zapraszam do mojego oficjalnego sklepu EWS Enagic.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kangenpolska.pl/">
  <style>
    :root {
      --ink: #1d2530;
      --muted: #5b6572;
      --accent: #0e7490;
      --accent-dark: #0a5a70;
      --bg: #ffffff;
      --bg-soft: #f6f9fa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
    }
    .hero { max-width: 640px; }
    .kicker {
      display: inline-block;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }
    .lead {
      font-size: clamp(17px, 2.2vw, 20px);
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 40px;
    }
    .cta {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: clamp(18px, 2.4vw, 22px);
      font-weight: 600;
      padding: 20px 44px;
      border-radius: 999px;
      transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 6px 20px rgba(14, 116, 144, 0.25);
    }
    .cta:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(14, 116, 144, 0.3);
    }
    .cta-note {
      margin-top: 16px;
      font-size: 14px;
      color: var(--muted);
    }
    footer {
      background: var(--bg-soft);
      border-top: 1px solid #e7ecef;
      padding: 24px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <span class="kicker">Woda Kangen</span>
      <h1>Hej, jestem Barbara&nbsp;Karbowiak</h1>
      <p class="lead">
        Niezależny dystrybutor japońskich jonizatorów wody Kangen w Polsce.
        Zapraszam Cię do mojego oficjalnego sklepu EWS Enagic.
      </p>
      <a class="cta" href="https://kangenpolska.ecokangen.com/pl_US/">
        Przejdź do sklepu EWS&nbsp;→
      </a>
      <p class="cta-note">Oficjalna strona dystrybutora Enagic</p>
    </div>
  </main>
  <footer>
    <p>© Barbara Karbowiak · Więcej o wodzie alkalicznej na <a href="https://zdrowawoda.info">zdrowawoda.info</a></p>
  </footer>
</body>
</html>
